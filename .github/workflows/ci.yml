name: CI

# The fast correctness lane. Everything here runs on every push and every
# PR, because with bun the whole thing finishes in well under a minute —
# there is no expensive tier to defer post-merge the way reddb does.
#
# Runner: the free standard Ubuntu runner available to this public repository.
# Blacksmith remains reserved for the explicit release build in release.yml.

on:
  workflow_dispatch:
    inputs:
      preview_platforms:
        type: boolean
        description: Show selected platforms without running builds, tests or publication
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platforms:
    name: Select platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    outputs:
      linux_x64: ${{ steps.select.outputs.linux_x64 }}
      linux_arm64: ${{ steps.select.outputs.linux_arm64 }}
      windows_x64: ${{ steps.select.outputs.windows_x64 }}
      windows_arm64: ${{ steps.select.outputs.windows_arm64 }}
      macos_x64: ${{ steps.select.outputs.macos_x64 }}
      macos_arm64: ${{ steps.select.outputs.macos_arm64 }}
      linux_armv7: ${{ steps.select.outputs.linux_armv7 }}
      linux_x86: ${{ steps.select.outputs.linux_x86 }}
      any: ${{ steps.select.outputs.any }}
      docker_platforms: ${{ steps.select.outputs.docker_platforms }}
    steps:
      - id: select
        name: Filter platforms before allocating runners
        shell: python
        env:
          PLATFORM_DEFAULTS: '{"linux_x64":true,"linux_arm64":true,"windows_x64":true,"windows_arm64":false,"macos_x64":false,"macos_arm64":false,"linux_armv7":false,"linux_x86":false}'
          PLATFORM_AVAILABLE: '["linux_x64", "windows_x64"]'
          PLATFORM_MATRICES: |
            {}
        run: |
          import json
          import os

          defaults = json.loads(os.environ["PLATFORM_DEFAULTS"])
          enabled = {}
          for key in defaults:
              name = "ENABLE_" + key.upper()
              value = os.environ[name].lower()
              if value not in ("true", "false"):
                  raise SystemExit(f"{name} must be true or false, got {value!r}")
              enabled[key] = value == "true"

          matrices = json.loads(os.environ["PLATFORM_MATRICES"])
          available = json.loads(os.environ["PLATFORM_AVAILABLE"])
          output = {key: str(value).lower() for key, value in enabled.items()}
          output["any"] = str(any(enabled[key] for key in available)).lower()
          for job, entries in matrices.items():
              selected = [entry["row"] for entry in entries if enabled[entry["flag"]]]
              output["enabled_" + job] = str(bool(selected)).lower()
              # A placeholder keeps GitHub's matrix schema valid when the job is skipped.
              output["matrix_" + job] = json.dumps({"include": selected or [entries[0]["row"]]}, separators=(",", ":"))
          docker = [target for key, target in (("linux_x64", "linux/amd64"), ("linux_arm64", "linux/arm64")) if enabled[key]]
          output["docker_platforms"] = ",".join(docker)
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              for key, value in output.items():
                  handle.write(f"{key}={value}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("### Selected platforms\n\n")
              for key in available:
                  handle.write(f"- {key}: {str(enabled[key]).lower()}\n")
  windows-boundary:
    name: Windows command boundaries
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: PowerShell and cmd argument forwarding
        run: bun test src/windows-wsl-bridge.test.ts src/tool-policy.test.ts src/update-coordinator.test.ts src/maintenance-lifecycle.test.ts src/machine-profile.test.ts src/resource-choices.test.ts src/resource-diagnostics.test.ts src/resource-build.test.ts src/wizard-install.test.ts src/dev-config.test.ts src/wsl-sync.test.ts src/tui-setup-lifecycle.test.ts src/tui-install-lifecycle.test.ts src/windows-console-mode.test.ts

  # Does this red-dev still read what red-skills actually publishes?
  #
  # Separate from `check` because it is the one job that can fail
  # without anything in this repository having changed, and because it
  # needs the network while the rest deliberately does not. See
  # scripts/check-package-set-contract.ts for why the contract is
  # transcribed rather than imported, and why that needs an alarm.
    needs:
      - platforms
    if: ${{ !inputs.preview_platforms && (needs.platforms.outputs.windows_x64 == 'true') }}
  package-set-contract:
    name: red-skills package-set contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: The newest published manifest parses
        run: |
          set -euo pipefail
          set +e
          bun scripts/check-package-set-contract.ts
          status=$?
          set -e
          # 2 is "could not reach the release", which is a runner
          # problem and not a contract that broke. Reported, not failed:
          # a red here must mean the publisher moved.
          if [[ "$status" == "2" ]]; then
            echo "::warning::the red-skills release could not be reached; the contract was not checked"
            exit 0
          fi
          exit "$status"

    needs:
      - platforms
    if: ${{ !inputs.preview_platforms && (needs.platforms.outputs.linux_x64 == 'true') }}
  check:
    name: typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      # The RedSkills package-set tests verify a real release bundle and
      # a fixture signed here with cosign — the same program a machine
      # runs (it is a core manifest entry), never a reimplementation.
      - uses: sigstore/cosign-installer@v3

      - name: Test
        run: bun test

      - name: Version consistency
        # The binary reads its version from package.json, so drift is
        # impossible by construction — this asserts that construction
        # still holds rather than trusting it.
        run: |
          set -euo pipefail
          MANIFEST="$(bun -e 'console.log(require("./package.json").version)')"
          if [[ "$ENABLE_LINUX_X64" == true ]]; then bun run build:linux; fi
          if [[ "$ENABLE_WINDOWS_X64" == true ]]; then bun run build:windows; fi
          REPORTED="$(./dist/red-dev-linux-x64 --version)"
          [[ "$MANIFEST" == "$REPORTED" ]] || {
            echo "package.json says ${MANIFEST}, the binary reports ${REPORTED}"
            exit 1
          }
          echo "version ${MANIFEST} consistent"

      - name: Smoke — network CLI dispatch and private JSON
        run: bun scripts/network-cli-smoke.ts ./dist/red-dev-linux-x64

      - name: Smoke — embedded dotfiles survive compilation
        # The distribution model rests on this: a binary that cannot
        # carry config/ installs tools and no experience.
        run: |
          set -euo pipefail
          bun build scripts/embed-smoke.ts --compile --target=bun-linux-x64 --outfile /tmp/embed-smoke
          /tmp/embed-smoke | grep -q 'EMBED OK'

      - name: Smoke — the TUI survives compilation
        run: |
          set -euo pipefail
          bun build scripts/tui-smoke.ts --compile --target=bun-linux-x64 --outfile /tmp/tui-smoke
          /tmp/tui-smoke | grep -q 'SMOKE OK'

      - name: Smoke — the fullscreen layout renders with real colours
        # The theme preview is the reason the fullscreen mode exists. If
        # the swatches lose their background escapes they render as blank
        # space and the feature is silently gone, so the frame is
        # asserted rather than eyeballed.
        run: |
          set -euo pipefail
          bun scripts/tui-render-smoke.ts | grep -q 'RENDER OK'

      - name: Smoke — the binary answers
        run: |
          set -euo pipefail
          ./dist/red-dev-linux-x64 platform
          ./dist/red-dev-linux-x64 plan core
          # A rejected input must exit non-zero. Asserting the failure
          # path matters more than the happy one: a parser that silently
          # accepts nonsense looks fine in every green build.
          if ./dist/red-dev-linux-x64 plan nonsense 2>/dev/null; then
            echo "expected an invalid scope to fail"
            exit 1
          fi

    needs:
      - platforms
    if: ${{ !inputs.preview_platforms && (needs.platforms.outputs.linux_x64 == 'true') }}
  shell:
    name: shell and bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint the shipped shell
        # boot.sh runs on machines that have nothing installed, and the
        # dotfiles are sourced into every shell the user opens. Both are
        # worth a linter even though neither is compiled.
        run: |
          set -euo pipefail
          shellcheck -s sh boot.sh
          shellcheck -s bash config/bash/*.sh

      - name: boot.ps1 must be pure ASCII
        # Windows PowerShell 5.1 reads a BOM-less file as ANSI, so a
        # UTF-8 em-dash becomes three garbage bytes, breaks the enclosing
        # string, and reports a parse error twenty lines further down.
        # An em-dash in a comment cost exactly that once. A bootstrap
        # script is the last place to depend on encoding negotiation.
        run: |
          set -euo pipefail
          if LC_ALL=C grep -nP '[^\x00-\x7F]' boot.ps1; then
            echo "boot.ps1 contains non-ASCII (lines above). Use plain ASCII."
            exit 1
          fi
          echo "boot.ps1 is pure ASCII"
    needs:
      - platforms
    if: ${{ !inputs.preview_platforms && (needs.platforms.outputs.linux_x64 == 'true') }}
env:
  ENABLE_LINUX_X64: ${{ vars.ENABLE_LINUX_X64 || 'true' }}
  ENABLE_LINUX_ARM64: ${{ vars.ENABLE_LINUX_ARM64 || 'true' }}
  ENABLE_WINDOWS_X64: ${{ vars.ENABLE_WINDOWS_X64 || 'true' }}
  ENABLE_WINDOWS_ARM64: ${{ vars.ENABLE_WINDOWS_ARM64 || 'false' }}
  ENABLE_MACOS_X64: ${{ vars.ENABLE_MACOS_X64 || 'false' }}
  ENABLE_MACOS_ARM64: ${{ vars.ENABLE_MACOS_ARM64 || 'false' }}
  ENABLE_LINUX_ARMV7: ${{ vars.ENABLE_LINUX_ARMV7 || 'false' }}
  ENABLE_LINUX_X86: ${{ vars.ENABLE_LINUX_X86 || 'false' }}

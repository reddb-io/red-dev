name: release

# Both binaries are cross-compiled from one Linux runner. bun's
# --target flag produces the Windows executable without needing a
# Windows runner, which keeps the release reproducible from a single
# job instead of two that can drift.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Verify embedded dotfiles survive compilation
        # The distribution model depends on this: a binary that cannot
        # carry config/ installs tools and no experience.
        run: |
          bun build scripts/embed-smoke.ts --compile --target=bun-linux-x64 --outfile /tmp/embed-smoke
          /tmp/embed-smoke | grep -q 'EMBED OK'

      - name: Verify the TUI survives compilation
        run: |
          bun build scripts/tui-smoke.ts --compile --target=bun-linux-x64 --outfile /tmp/tui-smoke
          /tmp/tui-smoke | grep -q 'SMOKE OK'

      - name: Build
        run: bun run build

      - name: Sanity-check the Linux binary
        run: |
          ./dist/red-dev-linux-x64 --version
          ./dist/red-dev-linux-x64 platform
          ./dist/red-dev-linux-x64 plan core

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/red-dev-linux-x64
            dist/red-dev-windows-x64.exe
          generate_release_notes: true

      - name: Upload artifacts
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: red-dev-binaries
          path: dist/

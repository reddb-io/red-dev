name: Release

# reddb-style release pipeline: a `plan` job resolving stable tags or an
# explicitly requested `next` channel, a build, and a GitHub Release with
# checksums and build attestations.
#
# One deliberate simplification against reddb and toon: there is no OS
# matrix. bun cross-compiles the Windows executable from Linux, verified
# on both targets, so a single runner produces every asset. A matrix
# here would buy nothing and cost two more runners per release.
#
# Runners: GitHub-hosted, on purpose.
#
# This pipeline was on Blacksmith, which is faster and is billed. Every
# push to main cuts a release now, so the run count went from a handful
# a week to one per merge — and at that rate the build is the only job
# where the speed was worth anything, and it is under three minutes on a
# free runner.
#
# Removing the label also removes a failure mode the old comment here
# warned about: a Blacksmith label without the GitHub App installed on
# the org leaves the job queued forever rather than failing, which is a
# confusing way to discover a requirement.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options: [stable, next]
      version:
        description: Version for stable (e.g. 0.3.0)
        required: false

      preview_platforms:
        type: boolean
        description: Show selected platforms without running builds, tests or publication
        default: false
permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release mid-flight: a half-published release is worse
  # than a queued one.
  cancel-in-progress: false

jobs:
  platforms:
    name: Select platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    outputs:
      linux_x64: ${{ steps.select.outputs.linux_x64 }}
      linux_arm64: ${{ steps.select.outputs.linux_arm64 }}
      windows_x64: ${{ steps.select.outputs.windows_x64 }}
      windows_arm64: ${{ steps.select.outputs.windows_arm64 }}
      macos_x64: ${{ steps.select.outputs.macos_x64 }}
      macos_arm64: ${{ steps.select.outputs.macos_arm64 }}
      linux_armv7: ${{ steps.select.outputs.linux_armv7 }}
      linux_x86: ${{ steps.select.outputs.linux_x86 }}
      any: ${{ steps.select.outputs.any }}
      docker_platforms: ${{ steps.select.outputs.docker_platforms }}
    steps:
      - id: select
        name: Filter platforms before allocating runners
        shell: python
        env:
          PLATFORM_DEFAULTS: '{"linux_x64":true,"linux_arm64":true,"windows_x64":true,"windows_arm64":false,"macos_x64":false,"macos_arm64":false,"linux_armv7":false,"linux_x86":false}'
          PLATFORM_AVAILABLE: '["linux_x64", "windows_x64"]'
          PLATFORM_MATRICES: |
            {}
        run: |
          import json
          import os

          defaults = json.loads(os.environ["PLATFORM_DEFAULTS"])
          enabled = {}
          for key in defaults:
              name = "ENABLE_" + key.upper()
              value = os.environ[name].lower()
              if value not in ("true", "false"):
                  raise SystemExit(f"{name} must be true or false, got {value!r}")
              enabled[key] = value == "true"

          matrices = json.loads(os.environ["PLATFORM_MATRICES"])
          available = json.loads(os.environ["PLATFORM_AVAILABLE"])
          output = {key: str(value).lower() for key, value in enabled.items()}
          output["any"] = str(any(enabled[key] for key in available)).lower()
          for job, entries in matrices.items():
              selected = [entry["row"] for entry in entries if enabled[entry["flag"]]]
              output["enabled_" + job] = str(bool(selected)).lower()
              # A placeholder keeps GitHub's matrix schema valid when the job is skipped.
              output["matrix_" + job] = json.dumps({"include": selected or [entries[0]["row"]]}, separators=(",", ":"))
          docker = [target for key, target in (("linux_x64", "linux/amd64"), ("linux_arm64", "linux/arm64")) if enabled[key]]
          output["docker_platforms"] = ",".join(docker)
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              for key, value in output.items():
                  handle.write(f"{key}={value}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("### Selected platforms\n\n")
              for key in available:
                  handle.write(f"- {key}: {str(enabled[key]).lower()}\n")
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_skip: ${{ steps.plan.outputs.should_skip }}
      release_channel: ${{ steps.plan.outputs.release_channel }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      package_version: ${{ steps.plan.outputs.package_version }}
      github_prerelease: ${{ steps.plan.outputs.github_prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide release target
        id: plan
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          REF="${{ github.ref }}"
          IN_CHANNEL="${{ github.event.inputs.channel || 'stable' }}"
          IN_VERSION="${{ github.event.inputs.version || '' }}"

          SHOULD_SKIP=false
          CHANNEL=""
          TAG=""
          VERSION=""
          PRERELEASE=false

          manifest_version() { node -p "require('./package.json').version"; }
          normalize() { echo "${1#v}"; }

          if [[ "$EVENT" == "push" && "$REF" == refs/tags/v* ]]; then
            CHANNEL="stable"
            TAG="${REF#refs/tags/}"
            VERSION="$(normalize "$TAG")"
          elif [[ "$EVENT" == "push" && "$REF" == "refs/heads/main" ]]; then
            # A push to main releases. Which version depends on whether
            # the manifest was already bumped by hand in the change that
            # landed: honour that if its tag is free, otherwise take the
            # next patch. Bumping a hand-written 0.23.0 to 0.23.1 because
            # nothing had tagged it yet would silently discard a
            # deliberate minor.
            CHANNEL="stable"
            MANIFEST="$(manifest_version)"
            if git rev-parse -q --verify "refs/tags/v${MANIFEST}" >/dev/null; then
              VERSION="$(node -e '
                const [maj, min, pat] = process.argv[1].split(".").map(Number);
                console.log(`${maj}.${min}.${pat + 1}`);
              ' "$MANIFEST")"
              BUMP=true
            else
              VERSION="${MANIFEST}"
              BUMP=false
            fi
            TAG="v${VERSION}"
            echo "manifest=${MANIFEST} -> ${VERSION} (bump=${BUMP})"
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ "$IN_CHANNEL" == "stable" ]]; then
              [[ -z "$IN_VERSION" ]] && { echo "stable requires a version input"; exit 1; }
              CHANNEL="stable"
              VERSION="$(normalize "$IN_VERSION")"
              TAG="v${VERSION}"
            else
              VERSION="${IN_VERSION:-$(manifest_version)-next.${GITHUB_RUN_NUMBER}}"
              CHANNEL="next"
              TAG="v${VERSION}"
              PRERELEASE=true
            fi
          else
            SHOULD_SKIP=true
          fi

          # A stable tag must match the committed manifest. The binary
          # reads its version from package.json, so a mismatch here would
          # ship a release whose contents disagree with its own name.
          #
          # Only checked for a tag push. On a main push the manifest is
          # about to be made to match, below.
          if [[ "$SHOULD_SKIP" != "true" && "$CHANNEL" == "stable" && "$REF" == refs/tags/v* ]]; then
            MANIFEST="$(manifest_version)"
            if [[ "$MANIFEST" != "$VERSION" ]]; then
              echo "${TAG} resolves to ${VERSION}, but package.json is ${MANIFEST}."
              echo "Bump package.json, commit, then re-tag."
              exit 1
            fi
          fi

          {
            echo "should_skip=${SHOULD_SKIP}"
            echo "release_channel=${CHANNEL}"
            echo "release_tag=${TAG}"
            echo "package_version=${VERSION}"
            echo "github_prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

          echo "channel=${CHANNEL} tag=${TAG} version=${VERSION} skip=${SHOULD_SKIP}"

      # Make main say the version this release is about to carry, and
      # tag the commit that says it.
      #
      # Committed rather than only tagged because the binary reads its
      # version out of package.json — a tag whose commit still says the
      # previous number ships a `--version` that lies. The bump lands on
      # main so the next push computes from a truthful base.
      #
      # `git push` here uses GITHUB_TOKEN, whose pushes GitHub does not
      # turn into new workflow runs. That is what keeps this from being
      # an infinite loop rather than any [skip ci] marker.
      - name: Bump the manifest and tag it
        if: >-
          steps.plan.outputs.should_skip != 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.plan.outputs.release_tag }}
          VERSION: ${{ steps.plan.outputs.package_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$(node -p "require('./package.json').version")" != "$VERSION" ]]; then
            node -e '
              const fs = require("fs");
              const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
              p.version = process.argv[1];
              fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
            ' "$VERSION"
            git add package.json
            git commit -m "chore: ${VERSION}"
            git push origin HEAD:main
          fi

          git tag -a "$TAG" -m "red-dev ${VERSION}"
          git push origin "$TAG"

    needs:
      - platforms
    if: ${{ !inputs.preview_platforms && (needs.platforms.outputs.any == 'true') }}
  build:
    name: Build binaries
    needs:
      - plan
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.plan.outputs.should_skip != 'true') && (needs.platforms.outputs.any == 'true')) }}
    # The last billed job. See the note at the top: releases are now one
    # per merge, and two spare minutes per release is not worth paying
    # for on repeat.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      # The package-set tests sign and verify with the real cosign; see ci.yml.
      - uses: sigstore/cosign-installer@v3

      - name: Test
        run: bun test

      - name: Gate — embedded dotfiles survive compilation
        run: |
          set -euo pipefail
          bun build scripts/embed-smoke.ts --compile --target=bun-linux-x64 --outfile /tmp/embed-smoke
          /tmp/embed-smoke | grep -q 'EMBED OK'

      - name: Gate — the TUI survives compilation
        run: |
          set -euo pipefail
          bun build scripts/tui-smoke.ts --compile --target=bun-linux-x64 --outfile /tmp/tui-smoke
          /tmp/tui-smoke | grep -q 'SMOKE OK'

      - name: Set release version
        # For a prerelease the manifest still holds the base version, so
        # the binary would report the wrong one. Stable is already
        # verified equal by the plan job.
        run: |
          set -euo pipefail
          VERSION="${{ needs.plan.outputs.package_version }}"
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "$VERSION"
          echo "package.json set to ${VERSION}"

      - name: Build
        run: |
          set -euo pipefail
          if [[ "$ENABLE_LINUX_X64" == true ]]; then bun run build:linux; fi
          if [[ "$ENABLE_WINDOWS_X64" == true ]]; then bun run build:windows; fi


      - name: Smoke the built binary
        run: |
          set -euo pipefail
          EXPECTED="${{ needs.plan.outputs.package_version }}"
          REPORTED="$(./dist/red-dev-linux-x64 --version)"
          [[ "$REPORTED" == "$EXPECTED" ]] || {
            echo "version smoke: expected ${EXPECTED}, got ${REPORTED}"
            exit 1
          }
          ./dist/red-dev-linux-x64 platform
          ./dist/red-dev-linux-x64 plan core
          bun scripts/network-cli-smoke.ts ./dist/red-dev-linux-x64

        if: env.ENABLE_LINUX_X64 == 'true'
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum red-dev-* > SHA256SUMS
          cp SHA256SUMS checksums.txt
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/*

  publish:
    name: GitHub Release
    needs: [plan, build]
    if: ${{ !inputs.preview_platforms && (needs.plan.outputs.should_skip != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: binaries
          path: release

      - name: Attest build provenance
        # GitHub only persists attestations for public repos or paid org
        # plans; on a private repo the API refuses. Non-blocking so the
        # release still happens, and it starts working the moment the
        # repo goes public.
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: release/SHA256SUMS

      - name: Compose release body
        env:
          TAG: ${{ needs.plan.outputs.release_tag }}
          REPO: ${{ github.repository }}
          CHANNEL: ${{ needs.plan.outputs.release_channel }}
        run: |
          set -euo pipefail
          cat > release-body.md <<MARKDOWN
          # red-dev ${TAG}

          One development environment across Ubuntu 24.04, Ubuntu 26.04, WSL and native Windows.

          ## Install

          **Linux and WSL:**
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${REPO}/main/boot.sh | sh
          \`\`\`

          **Native Windows:**
          \`\`\`powershell
          irm https://raw.githubusercontent.com/${REPO}/main/boot.ps1 | iex
          \`\`\`

          Both resolve the asset for your platform from this release, install under your own user, and converge. Neither needs administrator or root rights for red-dev itself.

          ## Assets

          | Platform | Asset |
          | --- | --- |
          | Linux x86_64 (also WSL) | \`red-dev-linux-x64\` |
          | Windows x86_64 | \`red-dev-windows-x64.exe\` |

          Both are cross-compiled from a single Linux runner; the Windows executable needs no Windows host to build.

          ## Verification

          \`\`\`bash
          curl -fsSLO https://github.com/${REPO}/releases/download/${TAG}/SHA256SUMS
          sha256sum -c SHA256SUMS

          gh attestation verify red-dev-linux-x64 --repo ${REPO}
          \`\`\`
          MARKDOWN

          if [[ "${CHANNEL}" == "next" ]]; then
            cat >> release-body.md <<'MARKDOWN'

          ---

          > [!WARNING]
          > This is a prerelease cut from `main`. It has passed CI but has not been
          > through a stable tag. Use a `v*.*.*` release for anything you depend on.
          MARKDOWN
          fi

          cat release-body.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.release_tag }}
          name: red-dev ${{ needs.plan.outputs.release_tag }}
          body_path: release-body.md
          prerelease: ${{ needs.plan.outputs.github_prerelease }}
          generate_release_notes: true
          files: release/*
          token: ${{ secrets.GITHUB_TOKEN }}
env:
  ENABLE_LINUX_X64: ${{ vars.ENABLE_LINUX_X64 || 'true' }}
  ENABLE_LINUX_ARM64: ${{ vars.ENABLE_LINUX_ARM64 || 'true' }}
  ENABLE_WINDOWS_X64: ${{ vars.ENABLE_WINDOWS_X64 || 'true' }}
  ENABLE_WINDOWS_ARM64: ${{ vars.ENABLE_WINDOWS_ARM64 || 'false' }}
  ENABLE_MACOS_X64: ${{ vars.ENABLE_MACOS_X64 || 'false' }}
  ENABLE_MACOS_ARM64: ${{ vars.ENABLE_MACOS_ARM64 || 'false' }}
  ENABLE_LINUX_ARMV7: ${{ vars.ENABLE_LINUX_ARMV7 || 'false' }}
  ENABLE_LINUX_X86: ${{ vars.ENABLE_LINUX_X86 || 'false' }}

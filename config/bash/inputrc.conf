# Readline configuration, deployed as the file INPUTRC points at.
#
# Ported from omakub's defaults/bash/inputrc. This is the least visible
# and most felt part of the whole setup: history search on the arrow
# keys is the single binding people notice missing when they move to a
# machine that lacks it.

set meta-flag on
set input-meta on
set output-meta on
set convert-meta off
set completion-ignore-case on
set completion-prefix-display-length 2
set show-all-if-ambiguous on
set show-all-if-unmodified on

# Arrow keys match what you have typed so far against your history.
"\e[A": history-search-backward
"\e[B": history-search-forward
"\e[C": forward-char
"\e[D": backward-char

# Shift+Enter inserts a newline instead of running the line.
#
# Readline cannot see a modifier. A terminal sends 0x0D for Enter and
# 0x0D for Shift+Enter, so nothing here could tell them apart until the
# emulator was told to send something else — src/alacritty.ts binds
# Shift+Enter to ESC[13;2u, and src/wsl.ts does the same for Windows
# Terminal. These two lines are the other half of that.
#
# Two spellings because there are two protocols and red-dev runs under
# both. ESC[13;2u is the kitty keyboard protocol (Alacritty, kitty,
# WezTerm, Ghostty); ESC[27;2;13~ is xterm's modifyOtherKeys, which is
# what xterm and mintty send — and mintty is Git Bash, one of the five
# targets.
#
# The macro is quoted-insert followed by a linefeed. Readline has no
# "insert a newline" command: \C-q types the next character literally
# and \C-j is that character, so the buffer gets a real 0x0A and the
# line keeps going. Binding \C-j directly would not work — readline has
# it as accept-line, which is precisely the behaviour being avoided.
"\e[13;2u": "\C-q\C-j"
"\e[27;2;13~": "\C-q\C-j"

# Add a trailing slash immediately when completing a symlink to a directory.
set mark-symlinked-directories on

# Do not complete hidden files unless the pattern starts with a dot.
set match-hidden-files off

# Show all completions at once rather than paging them.
set page-completions off

# Ask before dumping more than this many completions.
set completion-query-items 200

# Show file type indicators when completing, the way `ls -F` does.
set visible-stats on

$if Bash
  # Consider the text after the cursor when completing, so "cd ~/src/mozil"
  # with the cursor on the z completes to ~/src/mozilla, not ~/src/mozillail.
  set skip-completed-text on
  set colored-stats on
$endif

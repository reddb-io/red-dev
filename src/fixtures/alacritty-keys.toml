# Generated by red-dev -- terminal keys.
#
# REWRITTEN ON EVERY CONVERGE. Bindings added here are lost the next time
# red-dev runs. Put your own in alacritty.toml, which is created once and
# never rewritten; Alacritty merges both, and a binding there wins.
#
# This warning exists because it was missing. The sentence was in
# alacritty.toml -- "the imported files, which red-dev regenerates" --
# which is the wrong file to say it in: nothing in a file named keys.toml
# suggested that editing keys was the thing not to do here.
#
# Ctrl+V is deliberately not bound here. Claude Code and Codex consume
# its raw control byte to attach an image from the system clipboard; an
# Alacritty Paste action would swallow the key before either agent saw it.
# Ctrl+Shift+V remains the terminal text-paste convention.
#
# Alt+V sends the same byte as an alias and matches Claude Code's
# documented Windows image shortcut.

[[keyboard.bindings]]
key = 'V'
mods = 'Control|Shift'
action = 'Paste'

[[keyboard.bindings]]
key = 'V'
mods = 'Alt'
chars = "\u0016"

[[keyboard.bindings]]
key = 'C'
mods = 'Control|Shift'
action = 'Copy'

[[keyboard.bindings]]
key = 'F11'
action = 'ToggleFullscreen'

# A second window, declared rather than inherited.
#
# Alacritty binds this itself on Linux and BSD, and a machine that had
# it was relying on that default -- which is not a promise the four
# targets keep equally, and not one this project should be quiet about.
# Declared here it behaves the same on Ubuntu, WSL and native Windows.

[[keyboard.bindings]]
key = 'N'
mods = 'Control|Shift'
action = 'CreateNewWindow'

# Shift+Enter, and why it needs a binding at all.
#
# A terminal sends the same byte for Enter and Shift+Enter — carriage
# return, 0x0D. The modifier is lost at the emulator, so every program
# downstream is looking at identical input and cannot tell them apart no
# matter what it binds. Claude Code's keybindings.json can say
# shift+enter all it likes; nothing will ever deliver one.
#
# ESC[13;2u is the kitty keyboard protocol's encoding: 13 is Enter's
# code point, 2 is "shift" (1 + the shift bit). Alacritty, kitty, foot,
# WezTerm, Ghostty and iTerm2 all speak it, and so do the frameworks the
# agents are built on — Ink 6.7+, crossterm, Bubble Tea 2.
#
# Deliberately not a literal newline, which is the other common answer.
# 0x0A is Ctrl+J, and readline binds Ctrl+J to accept-line — so in bash
# it would submit the line, which is the exact opposite of the point.
# config/bash/inputrc.conf binds the sequence below instead, where it
# collides with nothing.
[[keyboard.bindings]]
key = 'Return'
mods = 'Shift'
chars = "\u001b[13;2u"
